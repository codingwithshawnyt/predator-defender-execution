[project]
name = "pde"
version = "0.1.0"
description = "Regime-dependent predator-defender execution equilibria via multi-agent RL and EGTA in realistic LOB simulators."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Shawn Ray", email = "shawnray5699@gmail.com" },
]

dependencies = [
    # Core scientific stack
    "numpy>=1.18,<3",
    "scipy>=1.13",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16,<20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # ML / RL stack — torch from default PyPI wheel (CUDA-bundled on Windows)
    "torch>=2.4",
    "stable-baselines3[extra]>=2.3",
"pettingzoo>=1.24",
"supersuit>=3.10",
"gymnasium>=0.29",
    "tensorboard>=2.16",
    # Game theory + Experiment management
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.18,<0.19",
    "rich>=13",
    "typer>=0.12",
    "tqdm>=4.66",
# Statistics
"statsmodels>=0.14",
# PyMarketSim + gameanalysis installed manually via vendor fallback (see REPO_SETUP.md Step 16)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pde"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["build/", "dist/", "vendor/"]

[[tool.mypy.overrides]]
module = ["marketsim.*", "gameanalysis.*", "stable_baselines3.*", "pettingzoo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "gpu: marks tests requiring a CUDA GPU",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
